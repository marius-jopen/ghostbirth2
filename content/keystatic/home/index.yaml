about:
  sectionLabelNum: '01'
  sectionLabel: About
  title: She *stays.*
  paragraphs:
    - >-
      Not the version you see on social media. *The other version.* The
      desperation. The pressure. The willingness to accept anything to become a
      mother.
    - Shot in Bangkok. Latex, prosthetics, blood. **No CGI. No AI.**
  pullQuote: >-
    The pressure to become a mother is so great that a woman would rather carry
    a dead woman's child than go home empty.
