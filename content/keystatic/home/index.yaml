hero:
  tag: A Film by Marius Jopen · In Development
  titleLine1: Ghost
  titleLine2Primary: birth
  titleLine2Accent: '2'
  sub: BODY HORROR · BANGKOK · 90 MIN
  lede: >-
    **Elena can't have children.** She flies to Bangkok for a fertility massage
    at a place with a reputation for making infertile women pregnant. She
    doesn't know that thirty years ago a pregnant woman burned alive in the
    house, that the neighborhood calls it cursed, or that women disappear
    inside. She gets pregnant. *The child is not hers.*
