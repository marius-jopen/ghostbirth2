about:
  sectionLabelNum: '01'
  sectionLabel: About
  title: She *stays.*
  paragraphs:
    - >-
      Not the version you see on social media. *The other version.* The
      desperation. The pressure. The willingness to accept anything to become a
      mother.
    - >-
      Women from Germany fly to Asia for the children their own country denies
      them. This is a film about what they find there.
    - Shot in Bangkok. Latex, prosthetics, blood. **No CGI. No AI.**
  pullQuote: >-
    The pressure is so great that a woman would rather carry a dead woman's
    child than go home empty.
