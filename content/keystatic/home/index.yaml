statement:
  sectionLabelNum: '02'
  sectionLabel: Director's Statement
  title: |-
    It happened
    to *me.*
  meta: Marius Jopen · Berlin · 2025
  pdfLabel: → Full Statement (PDF)
  paragraphs:
    - I didn't come up with Ghost Birth. *It happened to me.*
    - >-
      In 2023, my first film screened at Foundation Cinema Oasis in Bangkok. I went to a
      massage studio nearby almost every day. After thirty sessions, Ing asked
      me if I knew the history of the building. I didn't. *She told me that
      thirty years ago, a pregnant woman had burned alive inside the house.* The
      locals avoid the place. That is why there are no Thai customers.
    - >-
      I had been lying on that floor for a month. *Inside a ghost story I didn't
      know I was part of.*
    - >-
      The first version of this film was about a man who runs from fatherhood.
      That man was me. The film has changed. It is no longer about a man who
      runs. **It is about a woman who stays.** Elena knows what is growing
      inside her. She knows the child belongs to a ghost. She knows the house is
      a machine. And she chooses to keep it.
    - >-
      All effects will be practical. *Built by hand, on set, with latex and
      light and sweat.*
  signature: — M. Jopen
  videoAfter:
    src: >-
      https://vz-39ea9c43-53e.b-cdn.net/8c06b352-57bc-4bec-8204-ffaab57f4089/playlist.m3u8
    label: BTS · BKK · 02
