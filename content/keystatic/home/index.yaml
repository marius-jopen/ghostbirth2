director:
  sectionLabelNum: '04'
  sectionLabel: Director
  title: Marius *Jopen.*
  portraitImage: /cms/director/director/portraitImage.jpg
  paragraphs:
    - Marius Jopen.
    - >-
      First feature: *Space Birth.* No budget. 300 volunteers. A spaceship made
      of cardboard. A film so unclassifiable that Foundation Cinema Oasis
      Bangkok invented a prize to honour it — Most Shocking Stoner Movie.
    - The residency that followed is where Ghost Birth 2 began.
    - >-
      This is his second feature. Bigger, darker, built with the same rule: by
      hand, or not at all.
