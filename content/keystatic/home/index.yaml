statement:
  sectionLabelNum: '02'
  sectionLabel: Director's Statement
  title: |-
    It happened
    to *me.*
  meta: Marius Jopen · Berlin · 2025
  pdfLabel: → Full Statement (PDF)
  body: >-
    I didn't come up with Ghost Birth. **It happened to me.**


    In 2023 I spent a month on the floor of a massage studio in Bangkok, almost
    every day. After thirty sessions, Ing asked me if I knew the history of the
    building. I didn't. She told me: **thirty years ago, a pregnant woman burned
    alive inside this house.** The locals avoid the place. That is why there are
    no Thai customers.


    **I had been lying inside a ghost house for a month without knowing.**


    The first version of this film was about a man who runs from fatherhood.
    That man was me. The film changed. It is no longer about a man who runs. It
    is about a woman who stays. **Elena knows what is growing inside her. She
    knows the child belongs to a ghost. She knows the house is a machine.**


    No CGI. No AI. Latex, light, sweat. Built by hand, on set. 
  videoAfter:
    src: >-
      https://vz-39ea9c43-53e.b-cdn.net/b39979b2-efa7-44ee-bf3e-abab52732b75/playlist.m3u8
