director:
  sectionLabelNum: '04'
  sectionLabel: Director
  title: Marius *Jopen.*
  portraitImage: /cms/director/director/portraitImage.jpg
  paragraphs:
    - >-
      Berlin-based filmmaker. His first feature *Space Birth* — a no-budget
      science fiction film built with 300 volunteers and a spaceship made of
      cardboard — won the *Most Shocking Stoner Movie Prize* at Foundation
      Cinema Oasis Bangkok. The residency there is where Ghostbirth 2 began.
    - Ghostbirth 2 is his second feature.
