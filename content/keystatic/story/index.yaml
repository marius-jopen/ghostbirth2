title: The Story
paragraphs:
  - >-
    Elena, a German woman, arrives in Bangkok after years of failed fertility
    treatments. She has heard of a massage studio that can cure infertile
    women. What she doesn’t know: thirty years ago, a pregnant woman died in a
    fire in this house.
  - >-
    Saul, a taxi driver haunted by his failure to step up when family needed
    him, drops Elena off and senses something wrong. When he returns with
    documents she left behind, the receptionist tells him no one named Elena is
    here.
  - >-
    Inside, Elena surrenders to the treatment. The masseuses wash her feet,
    feed her a thick red drink, massage her with hands that feel impossibly
    deep. Her body begins to change. Her belly swells.
  - >-
    When she discovers a hidden room of living flesh in the basement, she tries
    to flee. But the child inside her revolts, pulling her back into the house.
  - >-
    Saul follows the masseuses to a cemetery and witnesses a ritual at the
    grave of the woman who burned. He realizes Elena is carrying a dead woman’s
    child. He returns to save her.
