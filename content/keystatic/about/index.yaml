title: About
paragraphs:
  - >-
    Ghost Birth 2 is a horror film about motherhood. Not the version you see on
    social media: Glowing, beautiful, fulfilled. The other version. The
    desperation. The pressure. The willingness to accept anything, from anyone,
    just to become a mother.
  - >-
    Set entirely in Bangkok. Built by hand. Latex, prosthetics and a lot of
    blood.
  - >-
    First test shoot completed in 2025. Currently in development financing with
    a target production date of late 2026.
