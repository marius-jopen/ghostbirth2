synopsis:
  sectionLabelNum: '01'
  sectionLabel: Synopsis
  title: The *whole* story.
  spoilerTag: ⚠ Contains ending · Industry only
  paragraphs:
    - >-
      Elena flies from Germany to Bangkok, desperate for a child. Years of
      fertility treatments at home have failed. She checks into a massage studio
      with a reputation for making infertile women pregnant. *The house feeds
      her, washes her, touches her.* Her body begins to change.
    - >-
      The woman in the photograph on her dresser burned alive in this house
      thirty years ago, pregnant.
    - >-
      Saul, an English taxi driver, brought Elena in. He cannot let it go. He
      investigates. He returns to save her. *Elena welcomes him in.* She tells
      him he looks tired. He should get a massage.
    - >-
      The house takes Saul. **Elena gives birth in the basement.** She takes the
      child. The house burns. She walks out into the night.
  endCard: A mother. *90 minutes. English and Thai. Body horror.*
  sizzleNote: Sizzle coming soon.
  videoAfter:
    src: >-
      https://vz-39ea9c43-53e.b-cdn.net/fc16e15c-be6a-4d6f-849c-bb88a9f2870f/playlist.m3u8
    label: BTS · BKK · 05
