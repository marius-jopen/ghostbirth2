visual:
  sectionLabelNum: '04'
  sectionLabel: Visual Approach
  title: Practical. *In-camera.*
  leftHeading: What it is
  leftBody: >-
    Shot on location in Bangkok with *one built set* (the flesh room).
    Color-saturated, high contrast, close physical camera. Latex, prosthetics,
    blood — *as physical as the massage itself*. Full visual treatment in the
    Lookbook.
  refs:
    - name: Argento ·
      works: Suspiria, Phenomena
    - name: Cronenberg ·
      works: Videodrome
    - name: Scorsese ·
      works: Taxi Driver
  rightHeading: What it isn't
  rightBody: >-
    We are not making a clean film. We are not making a safe film. *Every effect
    is physical.*
  vetoes:
    - CGI
    - AI
    - Green Screen
    - Digital gore
    - Cheap jumpscares
