title: Director
text: >-
  Marius Jopen is a Berlin-based filmmaker and creative technologist. His debut
  film Space Birth — a no-budget science fiction film built with 300 volunteers
  and a spaceship made of cardboard — screened at Cinema Oasis Bangkok, where
  it won an award and led to the residency where Ghostbirth originated. Three
  research trips to Bangkok, 140 casting sessions, and a self-funded test shoot
  followed. Ghostbirth 2 is his second feature film.
