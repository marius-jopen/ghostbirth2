title: Test Shoot
description: >-
  In 2025, Marius Jopen flew to Bangkok with 7,000 euros of his own money, cast
  140 people, tested 14 actors, flew in cinematographer Nathan Ceddia from
  Australia, and shot for a week in massage studios across the city.
